[workspace]
members = ["crates/hejjetrac-core", "crates/hejjetrac-io", "crates/hejjetrac-camera", "crates/hejjetrac-control", "apps/hejjetrac-cli", "apps/hejjetrac-desktop"]
default-members = ["apps/hejjetrac-desktop"]
exclude = ["vendor/oxideav-h264", "vendor/nokhwa-bindings-linux"]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.95"
license = "CC-BY-NC-SA-3.0"

[workspace.dependencies]
hejjetrac-core = { path = "crates/hejjetrac-core" }
hejjetrac-io = { path = "crates/hejjetrac-io" }
hejjetrac-control = { path = "crates/hejjetrac-control" }
glam = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
oxideav-core = "=0.1.41"
oxideav-h264 = "=0.1.9"
oxideav-mp4 = "=0.0.10"

[patch.crates-io]
oxideav-h264 = { path = "vendor/oxideav-h264" }
nokhwa-bindings-linux = { path = "vendor/nokhwa-bindings-linux" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

