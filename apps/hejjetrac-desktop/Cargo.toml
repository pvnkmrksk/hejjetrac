[package]
name = "hejjetrac-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[dependencies]
getrandom = "0.3"
hejjetrac-core.workspace = true
hejjetrac-io.workspace = true
hejjetrac-control.workspace = true
hejjetrac-camera = { path = "../../crates/hejjetrac-camera" }
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
glam.workspace = true
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
rfd = { version = "0.15.4", default-features = false, features = ["xdg-portal", "async-std"] }
image = { version = "0.25", default-features = false, features = ["png"] }
[lints]
workspace = true
[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "27", default-features = false, features = ["metal", "wgsl"] }
[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "27", default-features = false, features = ["dx12", "wgsl"] }
[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "27", default-features = false, features = ["vulkan", "gles", "wgsl"] }
winit = { version = "=0.30.13", default-features = false, features = ["x11", "wayland"] }
x11rb = { version = "0.13", default-features = false, features = ["randr"] }

[[bin]]
name = "hejjetrac"
path = "src/main.rs"
